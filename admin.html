<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Studio Dashboard | Blue Raven</title><link rel="stylesheet" href="/style.css"><style>
.admin-shell{max-width:1100px;margin:auto;padding:70px 6vw}.admin-shell h1{font:600 48px Oswald}.admin-panel{background:#141617;border:1px solid #333;padding:28px;margin-top:25px}.admin-panel input,.admin-panel select{background:#090a0b;color:white;border:1px solid #444;padding:12px}.login-form{display:flex;gap:12px;flex-wrap:wrap}.login-form input{min-width:210px}.admin-table{width:100%;border-collapse:collapse;margin-top:25px;font-size:12px}.admin-table th,.admin-table td{padding:13px 9px;border-bottom:1px solid #343637;text-align:left;vertical-align:top}.admin-table th{color:#9cb7c3}.admin-table select{padding:7px}.admin-muted{color:#999;font-size:12px;line-height:1.7}.admin-top{display:flex;justify-content:space-between;align-items:center;gap:20px}.admin-error{color:#ff9999}.admin-success{color:#a9d8b5}@media(max-width:700px){.admin-table{display:block;overflow-x:auto}.admin-shell{padding:40px 5vw}.admin-panel{padding:16px}}
</style></head><body><header class="topbar"><a class="brand" href="/"><span class="brand-mark">BR</span><span>BLUE RAVEN <small>TATTOO STUDIO</small></span></a><a class="text-link" href="/">← Back to website</a></header>
<main class="admin-shell"><p class="eyebrow">PRIVATE STUDIO AREA</p><h1>BOOKING DASHBOARD</h1><p class="admin-muted">Sign in to view booking requests and update their status. Keep this page and your admin password private.</p>
<section class="admin-panel" id="login-panel"><h2>ADMIN SIGN IN</h2><form class="login-form" id="login-form"><input name="username" placeholder="Username" required autocomplete="username"><input name="password" type="password" placeholder="Password" required autocomplete="current-password"><button class="btn btn-light">SIGN IN</button></form><p id="login-message" class="admin-error"></p></section>
<section class="admin-panel" id="dashboard" hidden><div class="admin-top"><h2>BOOKING REQUESTS</h2><button class="btn btn-outline" id="logout">SIGN OUT</button></div><p id="load-message" class="admin-muted"></p><div id="bookings"></div></section></main>
<script>
const loginPanel=document.getElementById('login-panel'),dashboard=document.getElementById('dashboard');
const msg=document.getElementById('login-message'),list=document.getElementById('bookings');
async function loadBookings(){const r=await fetch('/api/admin/bookings');if(!r.ok){loginPanel.hidden=false;dashboard.hidden=true;return}const rows=await r.json();dashboard.hidden=false;loginPanel.hidden=true;document.getElementById('load-message').textContent=rows.length+' booking request(s)';if(!rows.length){list.innerHTML='<p class="admin-muted">No booking requests yet.</p>';return}
list.innerHTML='<table class="admin-table"><thead><tr><th>CLIENT</th><th>IDEA / DETAILS</th><th>PREFERRED DATE</th><th>RECEIVED</th><th>STATUS</th></tr></thead><tbody>'+rows.map(b=>`<tr><td><strong>${esc(b.name)}</strong><br>${esc(b.email)}<br>${esc(b.phone)}</td><td>${esc(b.tattoo_type)} · ${esc(b.size)}<br>Placement: ${esc(b.placement)}<br>${esc(b.description)}${b.reference_url?'<br><a target="_blank" rel="noopener" href="'+esc(b.reference_url)+'">Reference link</a>':''}</td><td>${b.preferred_date?new Date(b.preferred_date).toLocaleDateString():'Flexible'}<br>${esc(b.preferred_time||'')}</td><td>${new Date(b.created_at).toLocaleString()}</td><td><select data-id="${b.id}">${['New','Contacted','Confirmed','Completed','Cancelled'].map(s=>`<option ${s===b.status?'selected':''}>${s}</option>`).join('')}</select></td></tr>`).join('')+'</tbody></table>';
list.querySelectorAll('select').forEach(s=>s.addEventListener('change',async()=>{const r=await fetch('/api/admin/bookings/'+s.dataset.id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:s.value})});if(!r.ok)alert('Could not update status. Please sign in again.')}));}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
document.getElementById('login-form').addEventListener('submit',async e=>{e.preventDefault();msg.textContent='';const d=Object.fromEntries(new FormData(e.currentTarget));const r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});const j=await r.json();if(!r.ok){msg.textContent=j.error;return}loadBookings()});
document.getElementById('logout').addEventListener('click',async()=>{await fetch('/api/admin/logout',{method:'POST'});dashboard.hidden=true;loginPanel.hidden=false});
loadBookings();
</script></body></html>
